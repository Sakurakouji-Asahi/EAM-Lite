{% extends "base.html" %}
{% block title %}盘盈转资产草稿 - EAM-Lite{% endblock %}
{% block content %}<div class="mx-auto" style="max-width:56rem"><h1 class="h3">盘盈转资产草稿</h1><div class="alert alert-warning">本次只创建资产草稿，不生成正式编号或二维码；草稿仍须补齐照片并走财务确认和贴标流程。</div><form method="post" class="card"><div class="card-body">{% csrf_token %}<input type="hidden" name="_idempotency_key" value="{{ idempotency_key }}">{% include "inventory/_form_fields.html" %}<div class="mb-3"><label class="form-label" for="conversion_remark">盘盈转草稿说明</label><textarea class="form-control" id="conversion_remark" name="conversion_remark" required>{{ remark }}</textarea></div></div><div class="card-footer d-flex gap-2"><button class="btn btn-success" type="submit">确认转为资产草稿</button><a class="btn btn-outline-secondary" href="{% url 'inventory:surplus-detail' task.pk surplus.pk %}">取消</a></div></form></div>{% endblock %}
