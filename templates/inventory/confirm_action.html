{% extends "base.html" %}
{% block title %}{{ title }} - EAM-Lite{% endblock %}
{% block content %}<div class="app-narrow-page app-narrow-page-sm"><header class="app-page-header"><div><h1 class="h3 mb-1">{{ title }}</h1><p class="text-secondary mb-0">执行前请核对影响范围。</p></div></header><div class="alert {% if danger %}alert-danger{% else %}alert-warning{% endif %}">{{ description }}</div>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post" class="card shadow-sm"><div class="card-body">{% csrf_token %}<div class="form-check"><input class="form-check-input" type="checkbox" name="confirm" id="confirm"><label class="form-check-label" for="confirm">我已核对影响范围并确认执行</label></div></div><div class="card-footer d-flex gap-2"><button class="btn {% if danger %}btn-danger{% else %}btn-primary{% endif %}" type="submit">{{ button_label }}</button><a class="btn btn-outline-secondary" href="{% url 'inventory:task-detail' task.pk %}">取消</a></div></form></div>{% endblock %}
