{% extends "base.html" %}
{% block title %}{{ title }} - EAM-Lite{% endblock %}
{% block content %}<div class="mx-auto" style="max-width:42rem"><h1 class="h3">{{ title }}</h1><div class="alert {% if danger %}alert-danger{% else %}alert-warning{% endif %}">{{ description }}</div>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post" class="card"><div class="card-body">{% csrf_token %}<div class="form-check"><input class="form-check-input" type="checkbox" name="confirm" id="confirm"><label class="form-check-label" for="confirm">我已核对影响范围并确认执行</label></div></div><div class="card-footer d-flex gap-2"><button class="btn {% if danger %}btn-danger{% else %}btn-primary{% endif %}" type="submit">{{ button_label }}</button><a class="btn btn-outline-secondary" href="{% url 'inventory:task-detail' task.pk %}">取消</a></div></form></div>{% endblock %}
