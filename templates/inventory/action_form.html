{% extends "base.html" %}
{% block title %}{{ title }} - EAM-Lite{% endblock %}
{% block content %}<div class="mx-auto" style="max-width:48rem"><h1 class="h3">{{ title }}</h1><p class="text-secondary">{{ description }}</p><form method="post"{% if multipart %} enctype="multipart/form-data"{% endif %} class="card shadow-sm"><div class="card-body">{% csrf_token %}{% include "inventory/_form_fields.html" %}</div><div class="card-footer d-flex gap-2"><button class="btn {% if danger %}btn-danger{% else %}btn-primary{% endif %}" type="submit">{{ button_label }}</button><a class="btn btn-outline-secondary" href="{% url 'inventory:task-detail' task.pk %}">取消</a></div></form></div>{% endblock %}
