{% extends "base.html" %}{% block title %}{{ title }} - EAM-Lite{% endblock %}{% block content %}<div class="app-narrow-page app-narrow-page-sm"><header class="app-page-header"><div><h1 class="h3 mb-1">{{ title }}</h1><p class="text-secondary mb-0">{{ task.task_no }} / {{ task.name }}</p></div><a class="btn btn-outline-secondary" href="{% url 'supplies:count-task-detail' task.pk %}">返回</a></header>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post" class="card card-body shadow-sm">{% csrf_token %}<div class="alert alert-warning mb-4">{{ warning }}</div><div class="form-check mb-4"><input class="form-check-input" id="confirm-count-action" type="checkbox" name="confirm" required><label class="form-check-label" for="confirm-count-action">我已核对任务范围和当前状态，确认执行此操作。</label></div><div class="d-flex flex-wrap gap-2 mobile-action-bar"><button class="btn btn-primary" type="submit">确认执行</button><a class="btn btn-outline-secondary" href="{% url 'supplies:count-task-detail' task.pk %}">取消</a></div></form></div>{% endblock %}
