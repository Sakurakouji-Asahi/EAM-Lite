{% extends "base.html" %}
{% block title %}{{ title }} - EAM-Lite{% endblock %}
{% block content %}

  <div class="card shadow-sm app-form-section"><div class="card-body">
    {% url 'supplies:item-list' as cancel_url %}{% include "supplies/_form.html" %}
  </div></div>
{% endblock %}
