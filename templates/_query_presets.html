<details class="app-query-presets mt-3" data-query-preset-controls hidden>
  <summary class="small">常用查询 <span class="text-secondary">· 本浏览器</span></summary>
  <div class="mt-2">
    <p class="small text-secondary mb-2">记住本页已经应用的查询条件。修改条件后，请先点击“{{ query_action|default:'查询' }}”。</p>
    <ul class="list-unstyled d-flex flex-wrap gap-2 mb-2" data-query-preset-list aria-label="已保存的常用查询"></ul>
    <div class="d-flex flex-wrap gap-2 align-items-center">
      <label class="small">查询名称 <input class="form-control form-control-sm d-inline-block app-query-preset-name" type="text" maxlength="40" placeholder="例如：车间待处理" data-query-preset-name></label>
      <button type="button" class="btn btn-sm btn-outline-primary" data-query-preset-save{% if preset_errors %} disabled{% endif %}>记住当前查询</button>
    </div>
    <p class="small text-secondary mb-0 mt-2" data-query-preset-status role="status" aria-live="polite"></p>
  </div>
</details>
