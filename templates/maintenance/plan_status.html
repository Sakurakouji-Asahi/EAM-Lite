{% extends "base.html" %}{% block title %}保养计划状态{% endblock %}{% block content %}<div class="row justify-content-center"><div class="col-12 col-lg-7"><h1 class="h3">更新计划状态</h1><div class="alert alert-warning">终止计划后不可在普通页面恢复；处置联动由受控 Service 处理。</div><form method="post" class="card card-body">{% csrf_token %}<div class="mb-3"><label class="form-label" for="id_status">目标状态</label><select class="form-select" id="id_status" name="status" required><option value="active">启用</option><option value="suspended">暂停</option><option value="ended">终止</option></select></div><div class="mb-3"><label class="form-label" for="id_reason">原因</label><textarea class="form-control" id="id_reason" name="reason" required></textarea></div><button class="btn btn-warning">确认更新</button></form></div></div>{% endblock %}
