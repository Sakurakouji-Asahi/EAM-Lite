<section class="card"><div class="card-header">保养时间线</div><div class="table-responsive"><table class="table table-sm align-middle mb-0"><thead><tr><th>计划日期</th><th>实际完成</th><th>结果</th><th>执行人</th><th></th></tr></thead><tbody>{% for record in records %}<tr><td>{{ record.scheduled_date|date:'Y-m-d' }}</td><td>{{ record.completed_date|date:'Y-m-d' }}</td><td>{{ record.get_result_display }}{% if record.status == 'voided' %} <span class="badge text-bg-secondary">已作废</span>{% endif %}</td><td>{{ record.completed_by.name|default:'—' }}</td><td><a href="{% url 'maintenance:record-detail' record.pk %}">详情</a></td></tr>{% empty %}<tr><td colspan="5" class="text-center text-secondary">暂无完成记录。</td></tr>{% endfor %}</tbody></table></div></section>
