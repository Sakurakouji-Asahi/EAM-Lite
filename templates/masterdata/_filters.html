<form method="get" class="row g-2 align-items-end mb-3" role="search">
  <div class="col-12 col-md-5">
    <label class="form-label" for="master-search">搜索</label>
    <input id="master-search" class="form-control" type="search" name="q" value="{{ q }}" placeholder="输入编码或名称">
  </div>
  <div class="col-8 col-md-3">
    <label class="form-label" for="master-status">启用状态</label>
    <select id="master-status" class="form-select" name="status">
      <option value="active"{% if status == 'active' %} selected{% endif %}>启用</option>
      <option value="inactive"{% if status == 'inactive' %} selected{% endif %}>停用</option>
      <option value="all"{% if status == 'all' %} selected{% endif %}>全部</option>
    </select>
  </div>
  <div class="col-4 col-md-2">
    <button class="btn btn-outline-primary w-100" type="submit">筛选</button>
  </div>
</form>
