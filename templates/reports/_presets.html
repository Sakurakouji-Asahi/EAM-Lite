{% if preset_token %}<details class="card card-body mb-3"><summary>个人常用查询{% if report_presets %}（{{ report_presets|length }}）{% endif %}</summary>
<div class="d-flex flex-wrap gap-3 my-2">{% for preset in report_presets %}<div class="d-flex gap-2 align-items-center"><a href="{% url 'reports:preset-apply' preset.pk %}">{{ preset.name }}</a><form method="post" action="{% url 'reports:preset-delete' preset.pk %}">{% csrf_token %}<button type="submit" class="btn btn-sm btn-outline-secondary" aria-label="删除常用查询 {{ preset.name }}">删除</button></form></div>{% endfor %}</div>
<form method="post" action="{% url 'reports:preset-save' %}" class="d-flex flex-wrap gap-2">{% csrf_token %}<input type="hidden" name="preset_token" value="{{ preset_token }}"><label for="preset-name" class="align-self-center">名称</label><input name="name" id="preset-name" class="form-control w-auto" required maxlength="80" placeholder="输入名称；同名将更新条件"><label for="preset-period" class="align-self-center">日期方式</label><select id="preset-period" name="relative_period" class="form-select w-auto">{% for value,label in relative_period_choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select><button class="btn btn-outline-primary" type="submit" data-report-export>保存已生效条件</button></form>
</details>{% endif %}
