{% if field.field.widget.input_type == 'checkbox' %}
<div class="col-12 col-md-6 col-xl-3 align-self-end"><div class="form-check mb-2">{{ field }}<label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label></div>{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>
{% else %}
<div class="col-12 col-md-6 col-xl-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}</div>
{% endif %}
