{% if batch_filter_summary %}<div class="d-flex flex-wrap align-items-center gap-2 mb-3" aria-label="已应用筛选"><span class="small text-secondary">已应用：</span>{% for filter in batch_filter_summary %}<a class="btn btn-sm btn-outline-secondary text-break text-start" href="{{ filter.remove_url }}" aria-label="取消{{ filter.label }}">{{ filter.label }} <span aria-hidden="true">×</span></a>{% endfor %}</div>{% endif %}
