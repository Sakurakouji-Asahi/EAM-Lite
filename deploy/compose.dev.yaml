name: eam-lite-dev

x-dev-environment: &dev-environment
  EAM_ENVIRONMENT: development
  SECRET_KEY_FILE: /run/secrets/secret_key
  DEBUG: "true"
  ALLOWED_HOSTS: 127.0.0.1,localhost
  CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8766
  BUSINESS_CURRENCY: CNY
  QR_BASE_URL: http://127.0.0.1:8766
  DB_ENGINE: postgresql
  DB_NAME: ${EAM_DEV_DATABASE_NAME:-eam_lite_dev}
  DB_HOST: db
  DB_PORT: "5432"
  STATIC_ROOT: /srv/static
  MEDIA_ROOT: /var/lib/eam-lite/media
  IMPORT_TEMP_ROOT: /var/lib/eam-lite/tmp
  BACKUP_ROOT: /var/backups/eam-lite/stage
  BACKUP_TEMP_ROOT: /var/backups/eam-lite/tmp
  BACKUP_KEY_FILE: /run/secrets/backup_key
  BACKUP_PG_MODE: native
  APP_VERSION: ${EAM_VERSION:?set EAM_VERSION}
  BUILD_COMMIT: ${EAM_BUILD_COMMIT:?set EAM_BUILD_COMMIT}
  BUILD_TIME: ${EAM_BUILD_TIME:-unknown}
  DATABASE_RUNTIME_ROLE: ${POSTGRES_RUNTIME_USER:-eam_lite_dev_runtime}
  LOG_LEVEL: INFO
  HOME: /tmp

x-dev-runtime: &dev-runtime
  <<: *dev-environment
  DB_USER: ${POSTGRES_RUNTIME_USER:-eam_lite_dev_runtime}
  DB_PASSWORD_FILE: /run/secrets/db_runtime_password

x-dev-migration: &dev-migration
  <<: *dev-environment
  DB_USER: ${POSTGRES_MIGRATION_USER:-eam_lite_dev_migration}
  DB_PASSWORD_FILE: /run/secrets/db_migration_password

services:
  db:
    image: ${EAM_POSTGRES_IMAGE:?set EAM_POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-eam_lite_dev_admin}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      EAM_DATABASE_NAME: ${EAM_DEV_DATABASE_NAME:-eam_lite_dev}
      EAM_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:-eam_lite_dev_migration}
      EAM_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-eam_lite_dev_runtime}
      EAM_MIGRATION_PASSWORD_FILE: /run/secrets/db_migration_password
      EAM_RUNTIME_PASSWORD_FILE: /run/secrets/db_runtime_password
    secrets:
      - db_admin_password
      - db_migration_password
      - db_runtime_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/01-eam-roles.sh:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  app:
    image: ${EAM_DEV_IMAGE:?set EAM_DEV_IMAGE}
    restart: unless-stopped
    environment: *dev-runtime
    secrets:
      - secret_key
      - db_runtime_password
      - backup_key
    volumes:
      - ..:/opt/eam-lite/app:ro
      - media_data:/var/lib/eam-lite/media
      - upload_tmp:/var/lib/eam-lite/tmp
      - backup_stage:/var/backups/eam-lite/stage
      - backup_tmp:/var/backups/eam-lite/tmp
    tmpfs:
      - /tmp:size=256m,mode=1770,uid=10001,gid=10001
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8766:8000"
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000", "--noreload"]

  release:
    image: ${EAM_DEV_IMAGE:?set EAM_DEV_IMAGE}
    profiles: ["release"]
    environment: *dev-migration
    secrets:
      - secret_key
      - db_migration_password
      - backup_key
    volumes:
      - ..:/opt/eam-lite/app:ro
      - media_data:/var/lib/eam-lite/media
      - upload_tmp:/var/lib/eam-lite/tmp
      - backup_stage:/var/backups/eam-lite/stage
      - backup_tmp:/var/backups/eam-lite/tmp
    tmpfs:
      - /tmp:size=256m,mode=1770,uid=10001,gid=10001
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py grant_runtime_database_privileges"]

volumes:
  postgres_data:
  media_data:
  upload_tmp:
  backup_stage:
  backup_tmp:

networks:
  backend:
    internal: false

secrets:
  secret_key:
    file: ${EAM_SECRET_KEY_FILE:?set EAM_SECRET_KEY_FILE}
  db_admin_password:
    file: ${EAM_DB_ADMIN_PASSWORD_FILE:?set EAM_DB_ADMIN_PASSWORD_FILE}
  db_migration_password:
    file: ${EAM_DB_MIGRATION_PASSWORD_FILE:?set EAM_DB_MIGRATION_PASSWORD_FILE}
  db_runtime_password:
    file: ${EAM_DB_RUNTIME_PASSWORD_FILE:?set EAM_DB_RUNTIME_PASSWORD_FILE}
  backup_key:
    file: ${EAM_BACKUP_KEY_FILE:?set EAM_BACKUP_KEY_FILE}
