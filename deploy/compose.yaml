name: eam-lite

x-app-environment: &app-environment
  EAM_ENVIRONMENT: production
  SECRET_KEY_FILE: /run/secrets/secret_key
  DEBUG: "false"
  ALLOWED_HOSTS: ${EAM_HOSTNAME:?set EAM_HOSTNAME}
  CSRF_TRUSTED_ORIGINS: https://${EAM_HOSTNAME:?set EAM_HOSTNAME}
  BUSINESS_CURRENCY: CNY
  QR_BASE_URL: https://${EAM_HOSTNAME:?set EAM_HOSTNAME}
  DB_ENGINE: postgresql
  DB_NAME: ${POSTGRES_DB:-eam_lite}
  DB_HOST: db
  DB_PORT: "5432"
  STATIC_ROOT: /srv/static
  MEDIA_ROOT: /var/lib/eam-lite/media
  IMPORT_TEMP_ROOT: /var/lib/eam-lite/tmp
  BACKUP_ROOT: /var/backups/eam-lite/stage
  BACKUP_TEMP_ROOT: /var/backups/eam-lite/tmp
  BACKUP_MIRROR_ROOT: /var/backups/eam-lite/mirror
  BACKUP_KEY_FILE: /run/secrets/backup_key
  BACKUP_PG_MODE: native
  BACKUP_PG_DUMP_BIN: /usr/bin/pg_dump
  BACKUP_PG_RESTORE_BIN: /usr/bin/pg_restore
  BACKUP_RETENTION_DAYS: "30"
  BACKUP_DOWNLOAD_GRANT_MINUTES: "10"
  BACKUP_RECENT_AUTH_MINUTES: "15"
  BACKUP_MAX_AGE_HOURS: "24"
  APP_COMMIT_SHA: ${APP_COMMIT_SHA:?set APP_COMMIT_SHA}
  DATABASE_RUNTIME_ROLE: ${POSTGRES_RUNTIME_USER:-eam_lite_runtime}
  SECURE_SSL_REDIRECT: "true"
  SESSION_COOKIE_SECURE: "true"
  CSRF_COOKIE_SECURE: "true"
  TRUST_PROXY_SSL_HEADER: "true"
  TRUST_PROXY_CLIENT_IP: "true"
  TRUSTED_PROXY_NETWORKS: "172.16.0.0/12"
  SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-86400}
  SECURE_HSTS_INCLUDE_SUBDOMAINS: "false"
  SECURE_HSTS_PRELOAD: "false"
  SESSION_COOKIE_AGE: "28800"
  SESSION_EXPIRE_AT_BROWSER_CLOSE: "true"
  LOG_LEVEL: INFO
  HOME: /tmp

x-runtime-environment: &runtime-environment
  <<: *app-environment
  DB_USER: ${POSTGRES_RUNTIME_USER:-eam_lite_runtime}
  DB_PASSWORD_FILE: /run/secrets/db_runtime_password

x-migration-environment: &migration-environment
  <<: *app-environment
  DB_USER: ${POSTGRES_MIGRATION_USER:-eam_lite_migration}
  DB_PASSWORD_FILE: /run/secrets/db_migration_password

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "10"

services:
  db:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-eam_lite_admin}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      EAM_DATABASE_NAME: ${POSTGRES_DB:-eam_lite}
      EAM_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:-eam_lite_migration}
      EAM_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-eam_lite_runtime}
      EAM_MIGRATION_PASSWORD_FILE: /run/secrets/db_migration_password
      EAM_RUNTIME_PASSWORD_FILE: /run/secrets/db_runtime_password
    secrets:
      - db_admin_password
      - db_migration_password
      - db_runtime_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/01-eam-roles.sh:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: eam-lite:${APP_COMMIT_SHA:?set APP_COMMIT_SHA}
    restart: unless-stopped
    logging: *default-logging
    read_only: true
    environment: *runtime-environment
    secrets:
      - secret_key
      - db_runtime_password
      - backup_key
    volumes:
      - static_data:/srv/static
      - media_data:/var/lib/eam-lite/media
      - upload_tmp:/var/lib/eam-lite/tmp
      - backup_stage:/var/backups/eam-lite/stage
      - backup_tmp:/var/backups/eam-lite/tmp
      - type: bind
        source: ${BACKUP_MIRROR_HOST_PATH:?set BACKUP_MIRROR_HOST_PATH}
        target: /var/backups/eam-lite/mirror
    tmpfs:
      - /tmp:size=256m,mode=1770,uid=10001,gid=10001
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/healthz/', headers={'Host': os.environ['ALLOWED_HOSTS'], 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=5).read()"]
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 30s

  release:
    image: eam-lite:${APP_COMMIT_SHA:?set APP_COMMIT_SHA}
    profiles: ["release"]
    environment: *migration-environment
    secrets:
      - secret_key
      - db_migration_password
      - db_admin_password
      - backup_key
    volumes:
      - static_data:/srv/static
      - media_data:/var/lib/eam-lite/media
      - upload_tmp:/var/lib/eam-lite/tmp
      - backup_stage:/var/backups/eam-lite/stage
      - backup_tmp:/var/backups/eam-lite/tmp
      - type: bind
        source: ${BACKUP_MIRROR_HOST_PATH:?set BACKUP_MIRROR_HOST_PATH}
        target: /var/backups/eam-lite/mirror
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py grant_runtime_database_privileges"]

  backup:
    image: eam-lite:${APP_COMMIT_SHA:?set APP_COMMIT_SHA}
    profiles: ["backup"]
    environment: *runtime-environment
    secrets:
      - secret_key
      - db_runtime_password
      - backup_key
    volumes:
      - media_data:/var/lib/eam-lite/media:ro
      - upload_tmp:/var/lib/eam-lite/tmp
      - backup_stage:/var/backups/eam-lite/stage
      - backup_tmp:/var/backups/eam-lite/tmp
      - type: bind
        source: ${BACKUP_MIRROR_HOST_PATH:?set BACKUP_MIRROR_HOST_PATH}
        target: /var/backups/eam-lite/mirror
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python manage.py fail_stale_eam_backups --older-minutes 60 && python manage.py create_eam_backup && python manage.py expire_eam_backups && python manage.py check_eam_backup_health"]

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    logging: *default-logging
    environment:
      EAM_HOSTNAME: ${EAM_HOSTNAME:?set EAM_HOSTNAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static_data:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  static_data:
  media_data:
  upload_tmp:
  backup_stage:
  backup_tmp:
  caddy_data:
  caddy_config:

networks:
  frontend:
  backend:
    internal: true

secrets:
  secret_key:
    file: ${EAM_SECRET_KEY_FILE:?set EAM_SECRET_KEY_FILE}
  db_admin_password:
    file: ${EAM_DB_ADMIN_PASSWORD_FILE:?set EAM_DB_ADMIN_PASSWORD_FILE}
  db_migration_password:
    file: ${EAM_DB_MIGRATION_PASSWORD_FILE:?set EAM_DB_MIGRATION_PASSWORD_FILE}
  db_runtime_password:
    file: ${EAM_DB_RUNTIME_PASSWORD_FILE:?set EAM_DB_RUNTIME_PASSWORD_FILE}
  backup_key:
    file: ${EAM_BACKUP_KEY_FILE:?set EAM_BACKUP_KEY_FILE}
