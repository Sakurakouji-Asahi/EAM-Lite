name: eam-lite-local

x-app-environment: &app-environment
  EAM_ENVIRONMENT: local
  SECRET_KEY_FILE: /run/secrets/secret_key
  DEBUG: "false"
  ALLOWED_HOSTS: 127.0.0.1
  CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8765
  BUSINESS_CURRENCY: CNY
  QR_BASE_URL: http://127.0.0.1:8765
  DB_ENGINE: postgresql
  DB_NAME: ${EAM_DATABASE_NAME:-eam_lite_local}
  DB_HOST: db
  DB_PORT: "5432"
  STATIC_ROOT: /srv/static
  MEDIA_ROOT: /var/lib/eam-lite/media
  IMPORT_TEMP_ROOT: /var/lib/eam-lite/tmp
  BACKUP_ROOT: /var/backups/eam-lite/stage
  BACKUP_TEMP_ROOT: /var/backups/eam-lite/tmp
  BACKUP_KEY_FILE: /run/secrets/backup_key
  BACKUP_PG_MODE: native
  BACKUP_PG_DUMP_BIN: /usr/bin/pg_dump
  BACKUP_PG_RESTORE_BIN: /usr/bin/pg_restore
  BACKUP_RETENTION_DAYS: "30"
  APP_VERSION: ${EAM_VERSION:?set EAM_VERSION}
  BUILD_COMMIT: ${EAM_BUILD_COMMIT:?set EAM_BUILD_COMMIT}
  BUILD_TIME: ${EAM_BUILD_TIME:-unknown}
  DATABASE_RUNTIME_ROLE: ${POSTGRES_RUNTIME_USER:-eam_lite_runtime}
  SECURE_SSL_REDIRECT: "false"
  SESSION_COOKIE_SECURE: "false"
  CSRF_COOKIE_SECURE: "false"
  TRUST_PROXY_SSL_HEADER: "false"
  TRUST_PROXY_CLIENT_IP: "false"
  SESSION_COOKIE_AGE: "28800"
  SESSION_EXPIRE_AT_BROWSER_CLOSE: "true"
  LOG_LEVEL: INFO
  HOME: /tmp

x-runtime-environment: &runtime-environment
  <<: *app-environment
  DB_USER: ${POSTGRES_RUNTIME_USER:-eam_lite_runtime}
  DB_PASSWORD_FILE: /run/secrets/db_runtime_password

x-migration-environment: &migration-environment
  <<: *app-environment
  DB_USER: ${POSTGRES_MIGRATION_USER:-eam_lite_migration}
  DB_PASSWORD_FILE: /run/secrets/db_migration_password

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-volumes: &app-volumes
  - static_data:/srv/static
  - media_data:/var/lib/eam-lite/media
  - upload_tmp:/var/lib/eam-lite/tmp
  - backup_stage:/var/backups/eam-lite/stage
  - backup_tmp:/var/backups/eam-lite/tmp

services:
  db:
    image: ${EAM_POSTGRES_IMAGE:?set EAM_POSTGRES_IMAGE}
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-eam_lite_admin}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      EAM_DATABASE_NAME: ${EAM_DATABASE_NAME:-eam_lite_local}
      EAM_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:-eam_lite_migration}
      EAM_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-eam_lite_runtime}
      EAM_MIGRATION_PASSWORD_FILE: /run/secrets/db_migration_password
      EAM_RUNTIME_PASSWORD_FILE: /run/secrets/db_runtime_password
    secrets:
      - db_admin_password
      - db_migration_password
      - db_runtime_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/01-eam-roles.sh:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  app:
    image: ${EAM_APP_IMAGE:?set EAM_APP_IMAGE}
    restart: unless-stopped
    read_only: true
    logging: *default-logging
    environment: *runtime-environment
    secrets:
      - secret_key
      - db_runtime_password
      - backup_key
    volumes: *app-volumes
    tmpfs:
      - /tmp:size=256m,mode=1770,uid=10001,gid=10001
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5).read()"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s

  release:
    image: ${EAM_APP_IMAGE:?set EAM_APP_IMAGE}
    profiles: ["release"]
    environment: *migration-environment
    secrets:
      - secret_key
      - db_migration_password
      - backup_key
    volumes: *app-volumes
    tmpfs:
      - /tmp:size=256m,mode=1770,uid=10001,gid=10001
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py grant_runtime_database_privileges"]

  portable:
    image: ${EAM_APP_IMAGE:?set EAM_APP_IMAGE}
    profiles: ["portable"]
    environment: *runtime-environment
    secrets:
      - secret_key
      - db_runtime_password
      - backup_key
      - portable_passphrase
    volumes:
      - media_data:/var/lib/eam-lite/media:ro
      - backup_stage:/var/backups/eam-lite/stage
      - backup_tmp:/var/backups/eam-lite/tmp
      - type: bind
        source: ${EAM_PORTABLE_OUTPUT_DIR:?set EAM_PORTABLE_OUTPUT_DIR}
        target: /portable-output
    tmpfs:
      - /tmp:size=256m,mode=1770,uid=10001,gid=10001
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "manage.py", "create_eam_backup", "--portable-output-dir", "/portable-output", "--passphrase-file", "/run/secrets/portable_passphrase"]

  restore:
    image: ${EAM_APP_IMAGE:?set EAM_APP_IMAGE}
    profiles: ["restore"]
    environment: *migration-environment
    secrets:
      - secret_key
      - db_migration_password
      - backup_key
      - portable_passphrase
    volumes:
      - media_data:/var/lib/eam-lite/media
      - backup_tmp:/var/backups/eam-lite/tmp
      - type: bind
        source: ${EAM_PORTABLE_BACKUP_FILE:?set EAM_PORTABLE_BACKUP_FILE}
        target: /restore/input.eambak
        read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1770,uid=10001,gid=10001
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "manage.py", "restore_eam_backup", "--package-file", "/restore/input.eambak", "--passphrase-file", "/run/secrets/portable_passphrase", "--target-current-empty", "--confirm-empty-local"]

  caddy:
    image: ${EAM_CADDY_IMAGE:?set EAM_CADDY_IMAGE}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8765:8080"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - static_data:/srv/static:ro
    networks:
      - frontend
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  static_data:
  media_data:
  upload_tmp:
  backup_stage:
  backup_tmp:

networks:
  frontend:
  backend:
    internal: true

secrets:
  secret_key:
    file: ${EAM_SECRET_KEY_FILE:?set EAM_SECRET_KEY_FILE}
  db_admin_password:
    file: ${EAM_DB_ADMIN_PASSWORD_FILE:?set EAM_DB_ADMIN_PASSWORD_FILE}
  db_migration_password:
    file: ${EAM_DB_MIGRATION_PASSWORD_FILE:?set EAM_DB_MIGRATION_PASSWORD_FILE}
  db_runtime_password:
    file: ${EAM_DB_RUNTIME_PASSWORD_FILE:?set EAM_DB_RUNTIME_PASSWORD_FILE}
  backup_key:
    file: ${EAM_BACKUP_KEY_FILE:?set EAM_BACKUP_KEY_FILE}
  portable_passphrase:
    file: ${EAM_PORTABLE_PASSPHRASE_FILE:?set EAM_PORTABLE_PASSPHRASE_FILE}
