name: Windows local release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate immutable version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "created_at=${created_at}" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists and is immutable." >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish exact application image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.version }}
            ${{ steps.metadata.outputs.image }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.metadata.outputs.version }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.metadata.outputs.created_at }}

      - name: Build Windows package and exact manifest
        shell: bash
        run: |
          python scripts/release/build_windows_package.py \
            --repository-root . \
            --output-dir dist \
            --commit "${GITHUB_SHA}" \
            --app-image "${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.version }}" \
            --app-image-digest "${{ steps.image.outputs.digest }}" \
            --repository "${GITHUB_REPOSITORY}" \
            --created-at "${{ steps.metadata.outputs.created_at }}"

      - uses: actions/upload-artifact@v4
        with:
          name: EAM-Lite-v${{ steps.metadata.outputs.version }}-Windows
          path: dist/*
          if-no-files-found: error

      - name: Publish immutable GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/EAM-Lite-v${{ steps.metadata.outputs.version }}-Windows.zip
            dist/EAM-Lite-v${{ steps.metadata.outputs.version }}-Windows.zip.sha256
            dist/release-manifest.json
